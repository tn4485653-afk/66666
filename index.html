<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>m4 status - 3D Voxel Interface</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --hologram-gradient: linear-gradient(135deg, #00f2fe, #4facfe, #7928ca, #ff0080);
            --bg-dark: #05070a;
            --cube-color: rgba(79, 172, 254, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* Tạo không gian 3D */
            perspective: 1000px;
        }

        /* Nền Grid 3D phía dưới */
        .grid-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(5, 7, 10, 0.1) 2px, transparent 2px),
                linear-gradient(90deg, rgba(5, 7, 10, 0.1) 2px, transparent 2px),
                linear-gradient(rgba(79, 172, 254, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79, 172, 254, 0.05) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            transform: rotateX(60deg) translateY(-100px);
            transform-origin: top;
            animation: gridMove 5s linear infinite;
            z-index: -2;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        /* Container cho các khối vuông 3D */
        .cubes-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .cube {
            position: absolute;
            width: 40px; height: 40px;
            transform-style: preserve-3d;
            animation: float 10s infinite linear;
            opacity: 0.6;
        }

        .face {
            position: absolute;
            width: 40px; height: 40px;
            background: rgba(121, 40, 202, 0.1);
            border: 1px solid var(--cube-color);
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.2);
        }

        /* Định hình khối lập phương */
        .front  { transform: translateZ(20px); }
        .back   { transform: rotateY(180deg) translateZ(20px); }
        .right  { transform: rotateY(90deg) translateZ(20px); }
        .left   { transform: rotateY(-90deg) translateZ(20px); }
        .top    { transform: rotateX(90deg) translateZ(20px); }
        .bottom { transform: rotateX(-90deg) translateZ(20px); }

        @keyframes float {
            0% { transform: translateY(110vh) rotateX(0deg) rotateY(0deg); }
            100% { transform: translateY(-20vh) rotateX(360deg) rotateY(360deg); }
        }

        /* Giao diện Header */
        nav {
            width: 100%; padding: 25px;
            display: flex; justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo {
            font-size: 2rem; font-weight: 900; letter-spacing: 5px;
            background: var(--hologram-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200%;
            animation: flow 3s infinite alternate;
        }

        /* Nội dung */
        .container {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px; text-align: center;
        }

        .brand-name {
            font-size: 4rem; font-weight: 900;
            text-transform: uppercase; margin-bottom: 10px;
            background: #fff;
            -webkit-background-clip: text;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .tagline {
            font-size: 0.8rem; color: #00dfd8;
            text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 40px; font-weight: 600;
            max-width: 80%; line-height: 1.6;
        }

        .button-group {
            display: flex; flex-direction: column;
            gap: 15px; width: 100%; max-width: 320px;
        }

        .btn {
            padding: 18px; border-radius: 12px;
            text-decoration: none; font-weight: 800;
            text-align: center; transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            gap: 10px;
        }

        .btn-discord {
            background: rgba(88, 101, 242, 0.1);
            color: #5865F2; border: 1px solid #5865F2;
        }

        .btn-start {
            background: var(--hologram-gradient);
            color: white; border: none;
            box-shadow: 0 10px 20px rgba(121, 40, 202, 0.3);
        }

        .btn:active { transform: scale(0.95); }

        @keyframes flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @media (max-width: 600px) {
            .brand-name { font-size: 3rem; }
        }
    </style>
</head>
<body onclick="startAll()" ontouchstart="startAll()">

    <div class="grid-background"></div>
    
    <!-- Các khối vuông 3D -->
    <div class="cubes-container">
        <div class="cube" style="left: 10%; animation-duration: 12s;">
            <div class="face front"></div><div class="face back"></div>
            <div class="face right"></div><div class="face left"></div>
            <div class="face top"></div><div class="face bottom"></div>
        </div>
        <div class="cube" style="left: 80%; animation-duration: 15s; animation-delay: 2s;">
            <div class="face front"></div><div class="face back"></div>
            <div class="face right"></div><div class="face left"></div>
            <div class="face top"></div><div class="face bottom"></div>
        </div>
        <div class="cube" style="left: 45%; animation-duration: 10s; animation-delay: 5s;">
            <div class="face front"></div><div class="face back"></div>
            <div class="face right"></div><div class="face left"></div>
            <div class="face top"></div><div class="face bottom"></div>
        </div>
    </div>

    <!-- Nhạc mới -->
    <audio id="bgMusic" loop>
        <source src="https://files.catbox.moe/ljvl6p.mp4" type="audio/mp4">
    </audio>

    <nav>
        <div class="logo">M4</div>
    </nav>

    <div class="container">
        <h1 class="brand-name">m4 status</h1>
        <p class="tagline">Tham Gia Server Discord - Tất Cả Free Không Mất Phí</p>

        <div class="button-group">
            <a href="https://discord.gg/G33hddEgW" target="_blank" class="btn btn-discord">
                <i class="fa-brands fa-discord"></i> DISCORD SERVER
            </a>
            <a href="https://code-web-t4ga.onrender.com/" class="btn btn-start">
                BẮT ĐẦU VÀO MENU
            </a>
        </div>
    </div>

    <script>
        var music = document.getElementById("bgMusic");
        var isPlaying = false;

        function startAll() {
            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                }).catch(e => console.log("User interaction required"));
            }
        }
    </script>
</body>
</html>
