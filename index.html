<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANELFFVN - ALWAYS SUCCESS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #05050a;
            overflow: hidden;
            position: relative;
        }

        /* Nền vũ trụ động */
        .stars-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            z-index: -1;
        }

        .nebula {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 0, 255, 0.1) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            filter: blur(50px);
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(100px, 100px); }
        }

        /* Khung Panel */
        .container {
            position: relative;
            z-index: 10;
            width: 360px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.7);
        }

        h1 {
            color: #ff00ff;
            font-size: 38px;
            font-weight: 900;
            text-shadow: 0 0 20px #ff00ff;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .label {
            color: #00d2ff;
            font-size: 11px;
            font-weight: 800;
            text-align: left;
            margin: 0 0 10px 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 30px;
            outline: none;
            text-align: center;
        }

        button {
            width: 100%;
            background: transparent;
            border: 2px solid #00d2ff;
            border-radius: 12px;
            padding: 16px;
            color: #00d2ff;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            background: #00d2ff;
            color: #000;
            box-shadow: 0 0 25px #00d2ff;
        }

        /* Toast thông báo trượt */
        .toast {
            position: fixed;
            top: 20px;
            right: -400px;
            width: 300px;
            background: rgba(10, 10, 20, 0.95);
            backdrop-filter: blur(10px);
            border-left: 5px solid #00ff00;
            padding: 20px;
            border-radius: 10px;
            color: white;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .toast.active { right: 20px; }

        .toast-header { color: #00ff00; font-weight: 900; font-size: 14px; margin-bottom: 5px; }
        .toast-body { font-size: 12px; opacity: 0.8; }

        .footer { margin-top: 40px; color: rgba(255, 255, 255, 0.2); font-size: 10px; letter-spacing: 4px; }
    </style>
</head>
<body>

    <div class="stars-bg"></div>
    <div class="nebula"></div>

    <div class="toast" id="toast">
        <div class="toast-header">THÀNH CÔNG</div>
        <div class="toast-body" id="toastMsg">Đã gửi lệnh Lag tới mục tiêu.</div>
    </div>

    <div class="container">
        <h1>PANELFFVN</h1>

        <div class="label">TARGET UID</div>
        <input type="text" id="uid" placeholder="Nhập UID đối thủ...">

        <button onclick="run()">KÍCH HOẠT LAG</button>

        <div class="footer">DESIGNED BY SIKIBIDI</div>
    </div>

    <script>
        function run() {
            const uidInput = document.getElementById('uid');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const btn = document.querySelector('button');

            if(!uidInput.value) {
                alert("Nhập UID đã ông giáo!");
                return;
            }

            // Hiệu ứng chạy giả
            btn.innerText = "ĐANG XỬ LÝ API...";
            btn.style.pointerEvents = "none";

            // Vẫn gọi API để server chạy ngầm
            fetch(`https://m4devtrollllag.onrender.com/lag?uid=${uidInput.value}`).catch(() => {});

            // Luôn hiện thành công sau 1.5 giây
            setTimeout(() => {
                btn.innerText = "KÍCH HOẠT LAG";
                btn.style.pointerEvents = "auto";
                
                toastMsg.innerText = `Đã kích hoạt gói tin Lag thành công cho UID: ${uidInput.value}`;
                toast.classList.add('active');

                // Tự đóng thông báo
                setTimeout(() => toast.classList.remove('active'), 4000);
                
                uidInput.value = "";
            }, 1500);
        }
    </script>
</body>
</html>
