<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>m4 status - Mobile Interface</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --hologram-gradient: linear-gradient(
                135deg,
                #ff0080,
                #7928ca,
                #0070f3,
                #00dfd8,
                #ff0080
            );

            --bg-dark: #0b0e14;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);

            display: flex;
            flex-direction: column;

            min-height: 100vh;
            overflow-x: hidden;

            padding-bottom: 50px;
        }

        nav {
            width: 100%;
            padding: 20px;

            display: flex;
            justify-content: center;

            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);

            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;

            background: var(--hologram-gradient);
            background-size: 400% 400%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: hologram-shift 5s ease infinite;
        }

        .container {
            flex: 1;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 20px;
            text-align: center;

            margin-top: 80px;
        }

        .brand-name {
            font-size: 3.5rem;
            font-weight: 900;

            text-transform: uppercase;
            line-height: 1;

            margin-bottom: 15px;

            background: var(--hologram-gradient);
            background-size: 400% 400%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: hologram-shift 5s ease infinite;
        }

        .tagline {
            font-size: 0.9rem;
            color: #a0a0a0;

            text-transform: uppercase;
            letter-spacing: 3px;

            margin-bottom: 40px;
        }

        .button-group {
            display: flex;
            flex-direction: column;

            gap: 15px;

            width: 100%;
            max-width: 300px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 16px 25px;

            border-radius: 15px;

            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;

            transition: all 0.3s ease;

            width: 100%;
        }

        /* Discord */
        .btn-discord {
            background: #5865F2;
            color: white;

            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.3);
        }

        .btn-discord i {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        /* Start */
        .btn-start {
            background: var(--hologram-gradient);
            background-size: 200% 200%;

            color: white;

            animation: hologram-shift 3s linear infinite;

            box-shadow: 0 5px 15px rgba(121, 40, 202, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .glow-sphere {
            position: fixed;

            width: 250px;
            height: 250px;

            background: var(--hologram-gradient);

            filter: blur(120px);
            opacity: 0.15;

            z-index: -1;
            border-radius: 50%;

            top: 30%;
        }

        @keyframes hologram-shift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @media (min-width: 600px) {
            .button-group {
                flex-direction: row;
                max-width: 500px;
            }

            .brand-name {
                font-size: 5rem;
            }
        }
    </style>
</head>

<body>

    <div class="glow-sphere"></div>

    <nav>
        <div class="logo">M4</div>
    </nav>

    <div class="container">

        <h1 class="brand-name">m4 status</h1>

        <p class="tagline">
            Tham gia Server discord - tất cả free không mất phí
        </p>

        <div class="button-group">

            <!-- Discord -->
            <a href="https://discord.gg/G33hddEgW"
               target="_blank"
               class="btn btn-discord">

                <i class="fa-brands fa-discord"></i>
                Discord Server

            </a>

            <!-- Start -->
            <a href="https://code-web-t4ga.onrender.com/"
               class="btn btn-start">

                Bắt Đầu vào Menu

            </a>

        </div>
    </div>

</body>
</html>
